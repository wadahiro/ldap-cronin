# ldap-cronin example configuration. Do not put passwords here (they are entered at run time without echo; LDAP_CRONIN_*_PASSWORD also works).

[source]                       # clone source: a dump (ldap-cronin dump; docs/dump.md), read instead of the server
ldif = "prod.ldif.gz"
# Or the server itself, read on every run (instead of ldif):
# url = "ldaps://src-ad.example.com:636"
# bind_dn = "CN=Administrator,CN=Users,DC=ad,DC=example,DC=com"
# ca_file = "ca.pem"           # for a self-signed certificate, give the CA, or (for testing only) set the line below to true
# insecure_skip_verify = true
# start_tls = true             # to use StartTLS on ldap://
# timeout = "2m"               # per LDAP operation; a hung server fails the run instead of blocking it. Default 2m, "0" for no limit

[target]                       # clone target (Samba4 AD / real AD / generic LDAP). Setting AD user passwords requires LDAPS
url = "ldaps://localhost:12636"
bind_dn = "CN=Administrator,CN=Users,DC=ad,DC=example,DC=com"
insecure_skip_verify = true

# [target.lab]                  # the target is a lab of `ldap-cronin lab`: `lab up --config config.toml` makes it like the
#                               # source (same domain, and on AD the same domain SID and GUID), starts it, and gives its
#                               # schema the source's definitions it lacks; then clone. Not for a real AD (docs/lab.md)
# image = "ldap-cronin/samba-ad:local"   # what it is created from (default: the offline package's image)
# instance = "dev2"            # another instance (it must exist); prefix = "ldap-cronin"
# native = true                # Samba only: write its database directly, keeping objectGUID and objectSid
# fast_password = true         # with native: the fixed password's NT hash written directly, ~3x faster, no Kerberos AES keys
# acl = "source"               # with native: the source's ACLs (owner, group, DACL), the domain root's included; default "lab"
# server_attributes = "lab"    # with native: the lab's own whenCreated, logon times, lockout and sIDHistory instead of the source's (the default)
# platform = "ec2"             # a Windows Server domain controller on Amazon EC2 instead (in progress: lab up --config
#                              # --dry-run shows the plan only; docs/lab.md). It needs region, subnet, instance_profile;
#                              # instance_type = "t3.large", windows = "2022" (2016, 2019, 2025) and password_parameter optional;
#                              # ldaps_name = "ldap.test.example.com" adds a DNS name to its LDAPS certificate;
#                              # ldap_port = 13389 forwards LDAP (389) too, for clients that do not use LDAPS;
#                              # recycle_bin = true enables the AD Recycle Bin. Its functional levels are the source's

[scope]                              # what clone copies and diff compares
# profile = "auto"                   # auto (default: asks the source), ad (Active Directory, Samba AD) or ldap (OpenLDAP, 389-ds, ...)
# root_dn = "o=acme"                 # only for a generic server whose naming context cannot be derived from base_dn
# Starting point in the source. The domain root (DC=...) takes the whole domain: the built-in entries
# (isCriticalSystemObject: Administrator, Domain Admins, ...) are never written, the target has its own.
# Parent OUs / containers above the starting point are created automatically if they do not exist on the target.
base_dn = "OU=IDM,DC=ad,DC=example,DC=com"
# base_dn = ["OU=Tokyo,DC=ad,DC=example,DC=com", "OU=Osaka,DC=ad,DC=example,DC=com"]   # several OUs as one scope:
#                                    # a reference from one to another is a reference of the scope (none below another)
# base_dn = "OU=*,DC=ad,DC=example,DC=com"   # every OU right under the domain but Domain Controllers: CN=Users,
#                                    # CN=Computers and the like are left out, but for what a reference names
# objects = ["ou", "group", "user"] # every kind of the profile if omitted (ad: also computer and contact)
# references = "clone"               # an entry outside the scope that a reference names (a member outside base_dn):
#                                    # clone (default) creates it as its kind, without its own references, so every
#                                    # member is on the target; existing writes only what the target holds; skip
# configuration_refs = "skip"        # AD: a reference naming the configuration partition (showInAddressBook naming an
#                                    # Exchange address list): skip (default) leaves the value out, counted with why;
#                                    # clone creates what it names and the parents it lacks from the source, for a
#                                    # lab (run ldap-cronin schema first: the lab has none of Exchange's classes)
# outside_groups = "clone"           # a group outside base_dn holding entries of it (a user's group of another OU,
#                                    # found through memberOf): clone (default) creates it and gives it those members;
#                                    # existing gives them only to a group the target holds; skip
# builtin_groups = "add"             # a built-in group holding them (Domain Admins): add (default) gives the target's own
#                                    # those members, nothing else; skip

# [scope.filters]                    # override the search filter per object type
# user = "(&(objectCategory=person)(objectClass=user)(department=IT))"

# [accounts]
# fixed_password = "Lab-Us3r-Passw0rd!"  # every cloned user's and computer's password (their hashes are never copied).
#                                      # A test value only, never a bind password: those are always asked or taken
#                                      # from the environment. Unset: LDAP_CRONIN_USER_PASSWORD, or asked. A dry-run
#                                      # prints it only with -with-password

[run]
workers = 8                          # parallel connections to the target, for clone and diff (1 = sequential). Default 8

[mapping]                            # how diff tells which source object a target object was cloned from (renames, moves)
# mode = "auto"                      # auto (default): marker on AD, preserve on generic LDAP | preserve | marker | file | off
# attribute = "adminDisplayName"     # marker: the attribute clone writes it into (default: the profile's; required on generic LDAP)
# operational = true                 # preserve: also copy createTimestamp, modifyTimestamp, creatorsName, modifiersName (default true)
# file = "mapping"                   # file: a local file of identifier pairs, for servers that allow neither

[attributes]
# By default (AD) the attributes Active Directory Users and Computers shows on its property sheets are copied, and a
# few more production uses (see `ldap-cronin list-attrs`, and docs/active-directory.md; -profile ldap for generic servers; `ldap-cronin check` says which attributes the entries hold that no list names, with the line to put here).
# mode = "all"   # AD: every attribute a client can write on each type's class, your schema extensions included
#                # (no include/extra_include then; exclude still applies). `ldap-cronin schema` carries the extensions.
# extra_include = ["extensionAttribute1", "mailNickname"]   # add to all types
# exclude = ["telephoneNumber"]                             # remove from all types
# [attributes.include]                                      # replace the default per type
# user = ["sAMAccountName", "givenName", "sn"]

[mask]
# The listed attributes are replaced with a fixed string on the target. diff does not compare masked attributes.
value = "********"
attributes = ["mail", "telephoneNumber"]
