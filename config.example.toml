# ldap-cronin example configuration. Do not put passwords here (they are entered at run time without echo; LDAP_CRONIN_*_PASSWORD also works).

[source]                       # clone source
url = "ldaps://src-ad.example.com:636"
bind_dn = "CN=Administrator,CN=Users,DC=ad,DC=example,DC=com"
# ca_file = "ca.pem"           # for a self-signed certificate, give the CA, or (for testing only) set the line below to true
# insecure_skip_verify = true
# start_tls = true             # to use StartTLS on ldap://
# timeout = "2m"               # per LDAP operation; a hung server fails the run instead of blocking it. Default 2m, "0" for no limit

[target]                       # clone target (Samba4 AD / real AD / generic LDAP). Setting AD user passwords requires LDAPS
url = "ldaps://localhost:12636"
bind_dn = "CN=Administrator,CN=Users,DC=ad,DC=example,DC=com"
insecure_skip_verify = true

[scope]                              # what clone copies and diff compares
# profile = "auto"                   # auto (default: asks the source), ad (Active Directory, Samba AD) or ldap (OpenLDAP, 389-ds, ...)
# root_dn = "o=acme"                 # only for a generic server whose naming context cannot be derived from base_dn
# Starting point in the source. The domain root (DC=...) cannot be used because it would overwrite built-in accounts.
# Parent OUs / containers above the starting point are created automatically if they do not exist on the target.
base_dn = "OU=IDM,DC=ad,DC=example,DC=com"
# objects = ["ou", "group", "user"] # every kind of the profile if omitted (ad: also computer and contact)
# references = "clone"               # an entry outside the scope that a reference names (a member outside base_dn):
#                                    # clone (default) creates it as its kind, without its own references, so every
#                                    # member is on the target; existing writes only what the target holds; skip

# [scope.filters]                    # override the search filter per object type
# user = "(&(objectCategory=person)(objectClass=user)(department=IT))"

# [accounts]
# fixed_password = "Lab-Us3r-Passw0rd!"  # every cloned user's and computer's password (their hashes are never copied).
#                                      # A test value only, never a bind password: those are always asked or taken
#                                      # from the environment. Unset: LDAP_CRONIN_USER_PASSWORD, or asked. A dry-run
#                                      # prints it only with -with-password

[run]
workers = 8                          # parallel connections to the target, for clone and diff (1 = sequential). Default 8

[mapping]                            # how diff tells which source object a target object was cloned from (renames, moves)
# mode = "auto"                      # auto (default): marker on AD, preserve on generic LDAP | preserve | marker | file | off
# attribute = "adminDisplayName"     # marker: the attribute clone writes it into (default: the profile's; required on generic LDAP)
# operational = true                 # preserve: also copy createTimestamp, modifyTimestamp, creatorsName, modifiersName (default true)
# file = "mapping"                   # file: a local file of identifier pairs, for servers that allow neither

[attributes]
# By default only the attributes Samba4 has out of the box are copied (see `ldap-cronin list-attrs`; add -profile ldap for generic servers).
# mode = "all"   # AD: every attribute a client can write on each type's class, your schema extensions included
#                # (no include/extra_include then; exclude still applies). `ldap-cronin schema` carries the extensions.
# extra_include = ["extensionAttribute1", "mailNickname"]   # add to all types
# exclude = ["telephoneNumber"]                             # remove from all types
# [attributes.include]                                      # replace the default per type
# user = ["sAMAccountName", "givenName", "sn"]

[mask]
# The listed attributes are replaced with a fixed string on the target. diff does not compare masked attributes.
value = "********"
attributes = ["mail", "telephoneNumber"]
